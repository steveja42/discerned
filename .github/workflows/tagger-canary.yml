# Phase 3.1 — weekly tagger canary.
#
# Runs the selector-anchor manifest for every per-site tagger against the LIVE
# sites and fails (with the dead selector named) when a redesign breaks a
# tagger. See tests/e2e/tagger-canary.spec.ts and CLAUDE.md → "Tagger canary /
# repair loop".
#
# IMPORTANT — coverage caveat: several canary targets (Reddit, YouTube,
# StackOverflow) sit behind Cloudflare / bot-walls that a stock GitHub-hosted
# runner has no warm `cf_clearance` for. Those targets will report as SKIP here
# (page-load failure → skip, not fail — the canary never flakes on infra). The
# sites that DO load headless-unauthenticated (primal, bsky, goodreads) are
# covered fully. For complete weekly coverage of the walled sites, run the
# canary LOCALLY against the warm `test` Chrome profile — see
# `scripts/tagger-canary-local.ps1` and CLAUDE.md.
#
# The workflow is still worthwhile: it catches redesigns on the open sites for
# free, and a run where a normally-loading site suddenly SKIPs is itself a
# signal worth eyeballing.

name: tagger-canary

on:
  schedule:
    # Mondays 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Test build of the extension (writes dist-test/, which the canary loads).
      - run: pnpm --filter=./discerned-ext build:test

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run tagger canary
        env:
          CANARY: '1'
        # The canary does not need the web app or fixture server — override the
        # config's webServer isn't possible per-project, so we let them start but
        # the canary never touches them. A page-load skip on a walled site is not
        # a failure; only a dead selector fails the job.
        run: pnpm exec playwright test -c tests/e2e/playwright.config.ts --project=tagger-canary

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagger-canary-report
          path: test-output/tagger-canary.txt
          if-no-files-found: ignore
