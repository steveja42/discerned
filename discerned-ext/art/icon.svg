<!--
  Discerned beacon — DARK master (azure, transparent background).

  This file is the ART SOURCE for the extension's raster icons; nothing loads it at
  runtime. `pnpm gen:icons` rasterises it to public/icons/icon{48,128}.png (16px comes
  from icon-small.svg) and mirrors those into discerned-web/public/icons/, which the
  Nostr profile avatar in .well-known/nostr.json points at.

  It lives in art/ and NOT in public/icons/ beside the PNGs: Vite's publicDir defaults
  to `public/`, so every file under it is copied verbatim into dist/ and into the zip
  users download. An art source has no business shipping in the extension.

  TRANSPARENT + FULL BLEED. There is no background rect: Chrome composites the toolbar
  icon onto whatever theme the user runs, so an opaque tile would show as a coloured
  square against their chrome. The mark is scaled to its own TIGHT bounding box
  (24x30 of the 32x36 coordinate system, measured via getBBox — the raw viewBox has
  ~4 units of slack on each side), so it spans the full 128px height with no margin.
  Azure #60a5fa is legible on both light and dark surfaces, which a transparent icon
  has to be.

  The inner <g> holds the beacon geometry copied VERBATIM from
  discerned-web/components/brand/MiniBeacon.tsx (viewBox 0 0 32 36) so the icon and
  the navbar mark are provably the same drawing. Only the wrapping transform and the
  colour literals differ. If you change the silhouette, change it in ALL FOUR masters
  (this, icon-small.svg, and the two under discerned-web/) plus MiniBeacon.tsx.
  Deliberately static: <animate> would not survive rasterisation anyway.
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Tight-bbox fit: scale 4.2667 = 128/30 (the mark's own height), then centre. -->
  <g transform="translate(-4.267 -12.8) scale(4.26667)" fill="none">
    <!-- Rays at 0.75 rather than MiniBeacon's 0.5 — same reasoning as the halo below:
         half-opacity azure disappears against a light background once there is no dark
         tile behind it. -->
    <g stroke="#60a5fa" stroke-width="1" stroke-linecap="round" opacity="0.75">
      <line x1="16" y1="9" x2="16" y2="3"/>
      <line x1="11.5" y1="10" x2="7.5" y2="6"/>
      <line x1="20.5" y1="10" x2="24.5" y2="6"/>
      <line x1="9" y1="13" x2="4" y2="12"/>
      <line x1="23" y1="13" x2="28" y2="12"/>
    </g>
    <!-- Lamp halo. 0.28, not MiniBeacon's 0.12: that value was tuned to sit on an
         opaque near-black tile, where 12% azure still reads. Composited onto an
         arbitrary background it becomes an ~alpha-30 smudge that makes the lamp look
         like a pale hole punched in the tower. -->
    <circle cx="16" cy="14" r="5" fill="#60a5fa" opacity="0.28"/>
    <path d="M 15.5 7 L 16.5 7 L 16 4 Z" fill="#60a5fa"/>
    <circle cx="16" cy="14" r="2.4" fill="#60a5fa"/>
    <rect x="13.2" y="15.5" width="5.6" height="2.4" rx="0.5" fill="#60a5fa"/>
    <path d="M 14.2 18 L 17.8 18 L 19.4 33 L 12.6 33 Z"
          stroke="#60a5fa" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
    <line x1="13.4" y1="22.5" x2="18.6" y2="22.5" stroke="#60a5fa" stroke-width="0.9" opacity="0.7"/>
    <line x1="13" y1="27" x2="19" y2="27" stroke="#60a5fa" stroke-width="0.9" opacity="0.7"/>
    <line x1="11" y1="33" x2="21" y2="33" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
