<!--
  Discerned beacon-on-cliff — SMALL master (16px toolbar size), azure, transparent.

  A 16x16 raster of the full beacon-on-cliff mark is an unreadable smudge if drawn at
  full detail — same problem the original beacon-only mark had. So this size keeps its
  own simplified drawing rather than a downscale of icon.svg:
    * five rays reduced to three (the diagonal pair collapsed onto the horizontals)
    * one ladder rung instead of two, at double weight
    * strokes at >=1.5 units so nothing renders sub-pixel after Lanczos
    * no 0.5-opacity on the rays — at this size they'd wash out
    * the cliff base is a simplified flat-topped wedge (no notch/step) under the tower,
      replacing the old straight base line — full corner detail doesn't survive 16px
      either.

  TRANSPARENT + FULL BLEED: no background rect. The tower is compressed slightly
  (was y=8.2..15.2, now y=7.6..13.0) to leave room for the cliff wedge beneath it
  (y=13.0..15.4) while the whole mark still reaches close to both edges.

  `pnpm gen:icons` uses THIS file for icon16.png, and icon.svg for every larger size.
  Keep the silhouette recognisably the same beacon-on-cliff.

  In art/ rather than public/icons/ for the same reason as icon.svg — publicDir copies
  everything under public/ straight into the shipped extension.
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Rays: vertical + two horizontals. Full-width so they read as "broadcasting". -->
  <g stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="8" y1="2.6" x2="8" y2="0.5"/>
    <line x1="3.1" y1="4.6" x2="1.0" y2="3.7"/>
    <line x1="12.9" y1="4.6" x2="15.0" y2="3.7"/>
  </g>

  <!-- Lamp. Sits clear of the tower: at 16px an adjoining lamp and tower antialias into
       one continuous blob and the beacon silhouette is lost, so there is a deliberate
       ~0.7px of daylight under it. -->
  <circle cx="8" cy="4.9" r="2.1" fill="#60a5fa"/>

  <!-- Tower: solid trapezoids rather than an outline — an outlined body at this size
       leaves a 1px interior that fills with antialiasing and reads as a blur.
       Split into two pieces, and the void between them IS the rung: on a transparent
       icon a rung cannot be "punched out" by overpainting the background colour (there
       isn't one), so it has to be a real gap in the geometry. The gap is 1.4px, not
       1px — a 1px void at this scale closes up under Lanczos antialiasing. -->
  <path d="M 6.65 7.6 L 9.35 7.6 L 9.95 9.7 L 6.05 9.7 Z" fill="#60a5fa"/>
  <path d="M 5.7 11.1 L 10.3 11.1 L 10.95 13.0 L 5.05 13.0 Z" fill="#60a5fa"/>

  <!-- Cliff base: a plain flat-topped trapezoid the tower stands on, in place of the
       old straight base line. Kept to straight edges, no taper/notch detail — the
       previous rounded-corner version antialiased into a blob at this size and read
       as a UFO saucer rather than a cliff. -->
  <path d="M 4.0 13.6 L 12.0 13.6 L 13.0 15.4 L 3.0 15.4 Z" fill="#60a5fa"/>
</svg>
