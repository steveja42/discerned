<!DOCTYPE html>
<!-- Role: Popup — restricted-page stub
     Description: Shown only when the toolbar icon is clicked on a tab where content scripts
                  cannot run (chrome://, file://, edge://, the Web Store, etc.). Background
                  toggles default_popup per-tab via chrome.action.setPopup so normal pages
                  open the overlay directly instead. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discerned</title>
  <style>
    /* Pre-JS theme fallback (dark). initPageTheme() injects the active theme's
       tokens into :root at load; these keep the page styled until it runs. */
    :root {
      --p-surface: #18181b;
      --p-ink: #f4f4f5;
      --p-ink-3: #a1a1aa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: var(--p-surface);
      color: var(--p-ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px 18px;
    }
    h1 { font-size: 0.95rem; color: var(--p-ink); margin-bottom: 6px; }
    p  { font-size: 0.8rem; color: var(--p-ink-3); line-height: 1.55; }
    /* Beacon brand mark (was a 📡 emoji). currentColor so it follows --p-ink.
       viewBox is the mark's TIGHT bbox (4 3 24 30), not the raw 0 0 32 36 of
       MiniBeacon.tsx — the raw box has ~4 units of slack a side, which would render
       the mark visibly smaller than the size set here. Same drawing as art/icon.svg. */
    .icon { width: 24px; height: 30px; color: var(--p-ink); margin-bottom: 6px; }
    .icon svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="4 3 24 30" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.5">
        <line x1="16" y1="9" x2="16" y2="3"/><line x1="11.5" y1="10" x2="7.5" y2="6"/>
        <line x1="20.5" y1="10" x2="24.5" y2="6"/><line x1="9" y1="13" x2="4" y2="12"/>
        <line x1="23" y1="13" x2="28" y2="12"/>
      </g>
      <circle cx="16" cy="14" r="5" fill="currentColor" opacity="0.12"/>
      <path d="M 15.5 7 L 16.5 7 L 16 4 Z" fill="currentColor"/>
      <circle cx="16" cy="14" r="2.4" fill="currentColor"/>
      <rect x="13.2" y="15.5" width="5.6" height="2.4" rx="0.5" fill="currentColor"/>
      <path d="M 14.2 18 L 17.8 18 L 19.4 33 L 12.6 33 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
      <line x1="13.4" y1="22.5" x2="18.6" y2="22.5" stroke="currentColor" stroke-width="0.9" opacity="0.7"/>
      <line x1="13" y1="27" x2="19" y2="27" stroke="currentColor" stroke-width="0.9" opacity="0.7"/>
      <line x1="11" y1="33" x2="21" y2="33" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Discerned can't clip this page</h1>
  <p>Browser-internal pages (chrome://, file://, the Web Store) don't allow extensions to inject the clipper. Open a normal web page and try again.</p>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
