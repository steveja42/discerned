# Netlify build config for the Discerned monorepo — the ONLY Netlify config.
#
# The dashboard has "Package directory" set to discerned-web, so Netlify reads
# THIS file (not a root netlify.toml). Base directory is the repo root, so the
# build runs from there; --filter makes pnpm build this package regardless of
# where it's invoked. Only the web app deploys to Netlify (the extension does not).

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter=./discerned-web build"
  # Static export (next.config.ts → output: 'export') emits to out/, not .next/.
  publish = "discerned-web/out"
  # Skip the deploy if the commit only touched files outside discerned-web/
  # (e.g. extension-only changes). Compares HEAD against the last successful
  # deploy's commit. Runs from the repo root, so the web app is just
  # `discerned-web` (no ../ prefix). Must be a bare `ignore = "..."` string
  # under [build] — NOT a [build.ignore] table (Netlify rejects that form).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- discerned-web"

[build.environment]
  PNPM_VERSION = "11"
  # Node 22 LTS is required by pnpm 11 (uses node:sqlite, introduced in Node 22).
  NODE_VERSION = "22"

# NIP-05 verifier — must allow cross-origin GET so other Nostr clients can
# verify alice@discerned.online identifiers. Cache 5 min so a new user becomes
# visible quickly while still amortising lookup traffic.
[[headers]]
  for = "/.well-known/nostr.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"

# GoatCounter analytics — reverse-proxied same-origin so hostname-based tracker
# blockers (uBlock etc.) can't drop the hit. status=200 keeps the URL same-origin
# in the browser; force=true wins even though the path isn't a real file.
#
# IMPORTANT: match the EXACT data path only, NOT /api/stats/* — a wildcard + force
# would also swallow /api/stats/count.js (the vendored counter script in public/),
# proxying it to a nonexistent goatcounter.com/count.js → 404, so count.js never
# loads and nothing is tracked. count.js POSTs to /api/stats/count?<query>; the
# query string doesn't affect path matching, so this exact rule still catches it,
# while /api/stats/count.js falls through to the static file.
[[redirects]]
  from = "/api/stats/count"
  to = "https://discernedweb.goatcounter.com/count"
  status = 200
  force = true
