# Netlify reads this file when "package path" is set to discerned-web/ in the
# Netlify dashboard. The build runs with the working directory at the monorepo
# root, but Netlify treats discerned-web/ as the effective project root.
#
# Use --filter so pnpm runs the build in this package regardless of where
# pnpm is invoked from.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter=./discerned-web build"
  publish = "discerned-web/.next"

[build.environment]
  PNPM_VERSION = "11"
  # Node 22 LTS is required by pnpm 11 (uses node:sqlite, introduced in Node 22).
  NODE_VERSION = "22"

# NIP-05 verifier — must allow cross-origin GET so other Nostr clients can
# verify alice@discerned.online identifiers. Cache 5 min so a new user becomes
# visible quickly while still amortising lookup traffic.
[[headers]]
  for = "/.well-known/nostr.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"

# GoatCounter analytics — reverse-proxied same-origin so hostname-based tracker
# blockers (uBlock etc.) can't drop the hit. The counter script is vendored at
# public/api/stats/count.js (served first-party); only the dynamic /api/stats/count
# hit is proxied here. status=200 keeps the URL same-origin in the browser; force=true
# wins even though the path isn't a real file. :splat forwards /api/stats/count →
# discernedweb.goatcounter.com/count. (Netlify can't interpolate env vars in redirect
# targets, so the site code is a committed literal.)
[[redirects]]
  from = "/api/stats/*"
  to = "https://discernedweb.goatcounter.com/:splat"
  status = 200
  force = true
