<!--
  Discerned beacon-on-cliff — LIGHT-THEME master (navy, transparent background).

  Next.js App Router picks this up by FILE CONVENTION as the site icon; there is no
  `metadata.icons` key in app/layout.tsx and none is needed. `pnpm gen:icons` (in
  discerned-ext) also rasterises it to app/favicon.ico (16/32/48/256) and
  app/apple-icon.png (180) for clients that ignore SVG icons.

  TRANSPARENT + FULL BLEED — no background rect, and the mark is scaled to its own
  TIGHT bounding box (20.4x29.05 of the outer 0..32 coordinate system, combining the
  beacon tower's translate(2.4 -0.6) scale(0.85) nested group with the cliff base
  drawn directly in outer coords) so it spans the full height with no margin. Browsers
  composite a favicon onto the tab strip, which is near-white in light mode and
  near-black in dark mode, so an opaque cream tile would read as a pale square in a
  dark tab strip.

  Navy is #1d4ed8 = var(--accent-ink) under body.style-studio, the same value
  app/globals.css gives the navbar .brand-mark — so tab and header match exactly.
  Note --accent-ink is ALSO defined at :root as an oklch amber; style-studio (applied
  to every page by layout.tsx) is what makes the effective value blue.

  Caveat this trades for: navy on a DARK tab strip is lower-contrast than the azure
  the extension uses. Acceptable because the mark still reads at tab size, and matching
  the navbar exactly was the point. If dark-mode tabs ever look too dim, the fix is a
  `<style>@media (prefers-color-scheme: dark)` block INSIDE this SVG — favicons honour
  it — not a second file.

  The DARK counterpart — used by the extension and by the Nostr avatar that
  public/.well-known/nostr.json points at — is discerned-ext/art/icon.svg.

  Geometry is copied VERBATIM from components/brand/MiniBeacon.tsx. If you change the
  silhouette, change it in ALL FOUR masters plus MiniBeacon.tsx.
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Tight-bbox fit: scale 4.4062 = 128/29.05 (the mark's own height), then centre. -->
  <g transform="translate(-6.499 -8.592) scale(4.40620)" fill="none">
    <g transform="translate(2.4 -0.6) scale(0.85)">
      <!-- Rays at 0.75 rather than MiniBeacon's 0.5 — half-opacity navy washes out once
           there is no opaque tile behind it. Same for the halo below. -->
      <g stroke="#1d4ed8" stroke-width="1.18" stroke-linecap="round" opacity="0.75">
        <line x1="16" y1="9" x2="16" y2="3"/>
        <line x1="11.5" y1="10" x2="7.5" y2="6"/>
        <line x1="20.5" y1="10" x2="24.5" y2="6"/>
        <line x1="9" y1="13" x2="4" y2="12"/>
        <line x1="23" y1="13" x2="28" y2="12"/>
      </g>
      <circle cx="16" cy="14" r="5" fill="#1d4ed8" opacity="0.28"/>
      <path d="M 15.5 7 L 16.5 7 L 16 4 Z" fill="#1d4ed8"/>
      <circle cx="16" cy="14" r="2.4" fill="#1d4ed8"/>
      <rect x="13.2" y="15.5" width="5.6" height="2.4" rx="0.5" fill="#1d4ed8"/>
      <path d="M 14.2 18 L 17.8 18 L 19.4 31.3 L 12.6 31.3 Z"
            stroke="#1d4ed8" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
      <line x1="13.4" y1="22.5" x2="18.6" y2="22.5" stroke="#1d4ed8" stroke-width="1.06" opacity="0.7"/>
      <line x1="13" y1="27" x2="19" y2="27" stroke="#1d4ed8" stroke-width="1.06" opacity="0.7"/>
    </g>
    <path d="M 8 26 L 24 26 L 24 29 L 19 31 L 11 30 L 8 28.4 Z" fill="#1d4ed8"/>
  </g>
</svg>
