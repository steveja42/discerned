# Netlify build config for the Discerned monorepo.
#
# The repo contains the Chrome extension (discerned-ext/) alongside the web
# app (discerned-web/). Only the web app deploys to Netlify. We point base
# at discerned-web/ and use the monorepo's pnpm workspace for installs so
# the lockfile and per-project deps stay consistent.

[build]
  base = "discerned-web"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

[build.environment]
  # Netlify auto-detects pnpm when this is set. Use 11 to match what's locally
  # installed; the lockfile we ship was generated by pnpm 11.
  PNPM_VERSION = "11"
  # Node 22 LTS is required by pnpm 11 (uses node:sqlite, introduced in Node 22).
  NODE_VERSION = "22"

[build.ignore]
  # Skip the deploy if the commit only touched files outside discerned-web/.
  # Compares HEAD against the last successful deploy's commit.
  command = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../discerned-web"

# GoatCounter analytics — reverse-proxied same-origin so hostname-based tracker
# blockers (uBlock etc.) can't drop the hit. Mirrors the identical rule in
# discerned-web/netlify.toml so whichever config Netlify loads (depends on the
# dashboard "package path" setting) has the proxy. The counter script is vendored
# at public/api/stats/count.js (served first-party); only the dynamic hit is proxied.
[[redirects]]
  from = "/api/stats/*"
  to = "https://discernedweb.goatcounter.com/:splat"
  status = 200
  force = true
